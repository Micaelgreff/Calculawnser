<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Windows 11</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">
    <!-- Tela da Calculadora -->
    <div class="display">
      <div id='historic' class="history"></div>
      <div id='current_expression' class="current-input"></div>
    </div>

    <!-- Teclado de Botões -->
    <div class="buttons">
      <!-- Linha 1 -->
      <button class="btn-secondary">%</button>
      <button class="btn-secondary">CE</button>
      <button onclick="clear_all_on_display(event)" class="btn-secondary">C</button>
      <button class="btn-secondary">⌫</button>

      <!-- Linha 2 -->
      <button class="btn-secondary">¹/x</button>
      <button class="btn-secondary">x²</button>
      <button class="btn-secondary">√x</button>
      <button class="btn-secondary">÷</button>

      <!-- Linha 3 -->
      <button onclick="number_function(event, 7)">7</button>
      <button onclick="number_function(event, 8)">8</button>
      <button onclick="number_function(event, 9)">9</button>
      <button class="btn-secondary">×</button>

      <!-- Linha 4 -->
      <button onclick="number_function(event, 4)">4</button>
      <button onclick="number_function(event, 5)">5</button>
      <button onclick="number_function(event, 6)">6</button>
      <button class="btn-secondary">-</button>

      <!-- Linha 5 -->
      <button onclick="number_function(event, 1)">1</button>
      <button onclick="number_function(event, 2)">2</button>
      <button onclick="number_function(event, 3)">3</button>
      <button onclick="add_function()" class="btn-secondary">+</button>

      <!-- Linha 6 -->
      <button class="btn-secondary">+/ -</button>
      <button onclick="number_function(event, 0)">0</button>
      <button class="btn-secondary">,</button>
      <button onclick="calculateValuesOnHold()" class="btn-accent">=</button>
    </div>
  </div>

</body>

<script src="script.js"></script>
</html>
